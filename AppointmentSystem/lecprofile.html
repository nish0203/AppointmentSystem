<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecturer Profile - Ms. Nurasma'</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9fafb;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* back-to-home button */
    #backBtn {
      position: fixed;
      top: 20px;
      left: 20px;
      background-color: #00aaff;;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      font-size: 14px;
      z-index: 1001;
    }

    
    #backBtn {
      font-size: 1rem;
      cursor: pointer;
      border-radius: 4px;
      }
      
    #backBtn:hover {
      background-color: #14214e;;
    }

    .profile-card {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      width: 90%;
      max-width: 700px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .profile-header {
      text-align: center;
    }

    .profile-pic {
      width: 120px;
      height: 120px;
      border-radius: 10px;
      object-fit: cover;
      border: 2px solid #555;
      margin-bottom: 15px;
    }

    h2 {
      margin: 10px 0;
      color: #1E3A8A;
    }

    .section {
      margin-top: 20px;
    }

    .section h4 {
      margin-bottom: 8px;
    }

    .section p {
      margin: 4px 0;
      color: #555;
      word-wrap: break-word;
    }

    .student-feedback {
      margin-top: 20px;
      background: #f3f4f6;
      padding: 10px;
      border-radius: 5px;
      max-height: 250px;
      overflow-y: auto;
    }

    .feedback-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #ddd;
    }

    .feedback-item:last-child {
      border-bottom: none;
    }

    .feedback-text {
      flex: 1;
      margin-right: 10px;
      cursor: pointer;
    }



    .feedback-buttons button {
      margin-left: 5px;
      padding: 4px 8px;
      font-size: 0.8rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .edit-btn {
      background-color: #3b82f6;
      color: white;
    }

    .delete-btn {
      background-color: #ef4444;
      color: white;
    }

    input.edit-input {
      width: 70%;
      padding: 4px;
      margin-right: 10px;
    }



  </style>
</head>
<body>

  <!-- Fixed Back button -->
  <button id="backBtn" onclick="goHome()">Go back to homepage</button>


  <div class="profile-card">
    <div class="profile-header">
      <img src="placeholder.png"
           alt="Profile Picture" class="profile-pic">
      <h2>Ms. Nurasma' Binti Shamsuddin</h2>
    </div>

    <div class="section">
      <h4>Department</h4>
      <p>Computing and Informatics</p>
    </div>

    <div class="section">
      <h4>Email</h4>
      <p>nurasma.shamsuddin@example.com</p>
    </div>

    <div class="section">
      <h4>Office Hours</h4>
      <p>Mon &amp; Fri, 8AM – 6PM</p>
    </div>

    <div class="section">
      <h4>Contact Phone</h4>
      <p>03-83125840</p>
    </div>


  </div>

  <script>
    function deleteFeedback(button) {
      button.closest('.feedback-item').remove();
    }
  


    // Custom Confirm Modal
    function showConfirm(message) {
      return new Promise(resolve => {
        // Create modal if it doesn't exist
        let modal = document.getElementById('custom-confirm-modal');
        if (!modal) {
          modal = document.createElement('div');
          modal.id = 'custom-confirm-modal';
          modal.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
          `;
          
          modal.innerHTML = `
            <div style="background: white; padding: 2rem; border-radius: 12px; max-width: 400px; text-align: center; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);">
              <h3 style="margin: 0 0 1rem 0; color: #1e293b; font-size: 1.2rem;">Confirm Action</h3>
              <p id="confirm-message" style="margin: 0 0 1.5rem 0; color: #64748b; line-height: 1.5;"></p>
              <div style="display: flex; gap: 1rem; justify-content: center;">
                <button id="confirm-yes" style="background: #ef4444; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; cursor: pointer; font-weight: 500;">Yes</button>
                <button id="confirm-no" style="background: #6b7280; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; cursor: pointer; font-weight: 500;">No</button>
              </div>
            </div>
          `;
          
          document.body.appendChild(modal);
        }
        
        const msg = document.getElementById('confirm-message');
        const yesBtn = document.getElementById('confirm-yes');
        const noBtn = document.getElementById('confirm-no');
        
        msg.textContent = message;
        modal.style.display = 'flex';
        
        function cleanup(result) {
          modal.style.display = 'none';
          yesBtn.onclick = null;
          noBtn.onclick = null;
          resolve(result);
        }
        
        yesBtn.onclick = () => cleanup(true);
        noBtn.onclick = () => cleanup(false);
      });
    }

    async function goHome() {
    if (await showConfirm('Are you sure you want to go back to the homepage?')) {
      window.location.href = 'admin.html'; // or whatever your landing page is
    }
  }
  </script>
  

</body>
</html>
